<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mokhorekhi Lebohang — Data Scientist{% endblock %}</title>
  <meta name="description" content="Mokhorekhi Lebohang — data scientist working on forecasting, optimisation and MLOps.">
  <meta name="color-scheme" content="light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="site-header">
    <div class="wrap header-row">
      <a href="{{ url_for('home') }}" class="brand">
        <span class="brand-mark">ML</span>
        <span class="brand-name">Mokhorekhi Lebohang</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('home') }}#projects" class="nav-link">Projects</a>
        <a href="{{ url_for('home') }}#about" class="nav-link">About</a>
        <a href="{{ url_for('home') }}#stack" class="nav-link">Stack</a>
        <a href="{{ url_for('home') }}#contact" class="nav-link">Contact</a>
        <span class="nav-divider"></span>
        <a href="{{ url_for('static', filename='resume.pdf') }}" class="btn btn-accent btn-sm" download>Resume</a>
      </nav>
    </div>
  </div>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div class="site-footer">
    <div class="wrap footer-row">
      <span class="footer-name">Mokhorekhi Lebohang</span>
      <span class="footer-year mono">2026</span>
    </div>
  </div>

</body>
</html>
